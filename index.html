<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission NovaControl : sauvez le service client</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#e9eef0;--panel:#fff;--ink:#1b1f23;--mute:#59646c;--yel:#f2b705;--ok:#1f8a4c;--bad:#c93c3c;--teal:#0f7f84}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--panel:#1e2327;--ink:#eceff1;--mute:#9aa6af;--ok:#4cc27f;--bad:#ef6b6b;--teal:#4fc3c8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 clamp(16px,1.6vw,19px)/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:980px;margin:0 auto;padding:16px}
h1,h2{font-family:"Archivo Black","Arial Black",Impact,sans-serif;font-weight:400;line-height:1.1;margin:0 0 10px}
h1{font-size:clamp(28px,5vw,46px)}h2{font-size:clamp(21px,3.2vw,32px)}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:6px;padding:18px;box-shadow:6px 6px 0 var(--ink);margin-bottom:16px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.go{background:var(--yel);color:#1b1f23;border:2px solid var(--ink);border-radius:6px;padding:11px 22px;font-family:"Archivo Black","Arial Black",sans-serif;box-shadow:4px 4px 0 var(--ink)}
input{padding:10px;border:2px solid var(--ink);border-radius:6px;background:var(--bg);width:100%;margin:6px 0}
.lead{color:var(--mute)}.up{color:var(--ok)}.dn{color:var(--bad)}
.rail{display:flex;list-style:none;padding:0;margin:0 0 16px}
.rail li{flex:1;text-align:center;font-size:.7em;color:var(--mute);position:relative;padding-top:22px}
.rail li::before{content:"";position:absolute;top:0;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.rail li::after{content:"";position:absolute;top:6px;left:calc(50% + 9px);right:calc(-50% + 9px);height:2px;background:var(--ink)}
.rail li:last-child::after{display:none}.rail li.done::before{background:var(--ok)}
.rail li.now{color:var(--ink);font-weight:600}.rail li.now::before{background:var(--yel)}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{display:flex;gap:12px;text-align:left;background:var(--bg);border:2px solid var(--ink);border-radius:6px;padding:12px 14px;align-items:flex-start;width:100%}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.opt small{display:block;color:var(--mute);margin-top:4px}
.opt.sel{outline:4px solid var(--yel)}.opt.good{border-color:var(--ok);border-width:3px}
.pct{height:8px;border:1px solid var(--ink);border-radius:4px;margin-top:6px;overflow:hidden}.pct i{display:block;height:100%;background:var(--teal)}
.take{border-left:8px solid var(--yel);background:var(--bg);padding:10px 14px;border-radius:0 6px 6px 0}
.code{font-family:"Archivo Black",sans-serif;font-size:clamp(48px,10vw,96px);letter-spacing:.12em}
.row{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.pl span{border:2px solid var(--ink);border-radius:20px;padding:2px 12px;background:var(--bg)}
.lb{padding:0;list-style:none}.lb li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--mute);padding:6px 0}
.chain{font-weight:600;color:var(--teal)}
@media (max-width:620px){.rail li{font-size:.58em}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main id="app"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,update,onValue,get} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyBm0m11SjOslvPUs73n_siTCyVK_8zEg38",authDomain:"prigi-494d2.firebaseapp.com",databaseURL:"https://prigi-494d2-default-rtdb.europe-west1.firebasedatabase.app",projectId:"prigi-494d2",storageBucket:"prigi-494d2.firebasestorage.app",messagingSenderId:"1066943798750",appId:"1:1066943798750:web:5f16746604df2da4eb114f"};

/* e: étape · r: rôle · t: titre · c: contexte · i: informations · q: question · o: options · g: bonne réponse · w: explications · k: à retenir · s: source */
const E=[
{e:"Approvisionnement et ingénierie",r:"responsables des achats et de l’ingénierie",t:"Un composant va disparaître !",
c:"Un fournisseur annonce la fin de fabrication d’un composant utilisé dans vos automates. NovaControl doit assurer leur maintenance pendant encore quatre ans. L’équipe étudie trois possibilités :",
i:["Le stock disponible permet de couvrir environ 10 mois de réparations.","Un composant de substitution pourrait être qualifié en 6 mois.","La reconception de la carte électronique nécessiterait 16 mois.","Le fournisseur ne peut pas livrer de stock supplémentaire suffisant pour quatre ans."],
q:"Quelle stratégie privilégiez-vous ?",
o:["Engager la reconception de la carte électronique en utilisant les pièces disponibles pendant le développement.","Organiser un dernier achat auprès du fournisseur pour constituer un stock destiné à la maintenance.","Réserver les pièces disponibles aux réparations et lancer la qualification du composant de substitution."],g:2,
w:["Reconception de la carte électronique. Cette solution permettrait de moderniser le produit, mais elle nécessite 16 mois, alors que le stock actuel ne couvre que 10 mois de maintenance. Le risque de rupture est donc trop important.","Dernier achat de composants. Constituer un stock est une stratégie pertinente, mais le fournisseur ne peut pas fournir suffisamment de pièces pour assurer les quatre années de maintenance restantes.","Qualification d’un composant alternatif. Cette solution permet de conserver les composants disponibles pour les réparations pendant les six mois nécessaires à la validation de l’alternative."],
k:"L’anticipation de l’obsolescence permet de sécuriser l’approvisionnement avant la disparition d’un composant.",
s:"Source : Shen & Willems (2014), Modeling sourcing strategies to mitigate part obsolescence."},
{e:"Commercialisation",r:"responsables de la gamme de produits",t:"Une nouvelle commande arrive",
c:"Quelques années plus tard, NovaControl prépare le retrait commercial de son ancienne gamme d’automates. Un client souhaite équiper une nouvelle ligne de production. Il connaît bien l’ancien modèle et préférerait conserver la même technologie. Vous savez que :",
i:["La nouvelle gamme est compatible avec son projet.","Les derniers composants de l’ancienne gamme sont nécessaires pour assurer les réparations futures.","Le client ne prévoit pas d’arrêt prolongé de ses installations existantes."],
q:"Quelle proposition faites-vous ?",
o:["Fournir les automates de l’ancienne gamme à partir du stock disponible, puis organiser leur remplacement à terme.","Fournir la nouvelle gamme pour le projet et conserver les anciens composants pour la maintenance du parc installé.","Proposer une migration globale des installations actuelles avant de mettre en service la nouvelle ligne."],g:1,
w:["Commercialiser l’ancienne gamme. Cette solution répondrait à la préférence du client, mais elle consommerait des composants nécessaires à la maintenance des automates déjà installés.","Proposer la nouvelle gamme. Elle permet d’équiper la nouvelle ligne de production tout en conservant les pièces de rechange pour les clients qui utilisent encore les anciens automates.","Organiser une migration complète. Cette solution réduirait la dépendance aux anciens équipements, mais elle nécessiterait un arrêt de production que le client ne peut pas envisager actuellement."],
k:"Le fabricant doit concilier la commercialisation de nouveaux produits et le maintien du service après-vente des équipements existants.",
s:"Source : Schneider Electric (2022), Modicon Life Cycle Management Policy."},
{e:"Migration",r:"responsables de l’ingénierie et du support technique",t:"Comment moderniser une installation existante ?",
c:"Un client souhaite remplacer son ancien contrôleur par un modèle plus récent.",
i:["Son installation possède de nombreux modules d’entrées/sorties reliés par un ancien réseau industriel.","Le remplacement de ces modules et de leur câblage nécessiterait un arrêt de production plus long que celui dont dispose le client.","NovaControl dispose d’un adaptateur validé permettant de relier ces anciens modules au nouveau contrôleur."],
q:"Quelle architecture proposez-vous ?",
o:["Renouveler le contrôleur et les modules d’entrées/sorties dans le cadre d’une migration complète.","Conserver le contrôleur existant et moderniser les outils de supervision de l’installation.","Installer le nouveau contrôleur en utilisant l’adaptateur prévu pour conserver les modules existants."],g:2,
w:["Migration complète. Elle permettrait de renouveler l’ensemble du système de contrôle, mais nécessiterait un arrêt de production plus long que celui autorisé par le client.","Modernisation de la supervision. Elle pourrait améliorer le suivi de l’installation, mais ne répondrait pas à l’objectif principal du client : remplacer son ancien contrôleur.","Migration progressive avec adaptateur. Elle permet de remplacer le contrôleur principal tout en conservant temporairement les anciens modules compatibles, grâce à une interface validée."],
k:"Les solutions de migration progressive facilitent la modernisation des installations et limitent les modifications nécessaires à court terme.",
s:"Source : Schneider Electric, Modicon Quantum — 140CRA31908 Adapter Module, Installation and Configuration Guide."},
{e:"Service après-vente",r:"responsables du service après-vente",t:"Un client signale une panne",
c:"Votre ancien automate n’est plus commercialisé, mais des engagements de maintenance sont encore en vigueur. Un client signale une panne et doit redémarrer sa ligne au cours de la semaine. Le service technique propose trois solutions :",
i:["Réparer son automate : retour prévu la semaine suivante.","Échanger son automate : une unité du même modèle, testée et compatible, est disponible sous deux jours.","Installer la nouvelle gamme : l’adaptation du programme nécessite une validation qui se terminerait la semaine suivante."],
q:"Quelle solution retenez-vous pour respecter le délai du client ?",
o:["Organiser la réparation du contrôleur défectueux par le centre de maintenance.","Fournir l’unité d’échange disponible et récupérer l’automate défectueux.","Remplacer le contrôleur par la nouvelle gamme et adapter le programme existant."],g:1,
w:["Réparation du contrôleur. Elle permettrait de conserver l’équipement d’origine, mais le délai de réparation annoncé dépasse celui dont dispose le client.","Échange standard. Une unité du même modèle, testée et compatible, est disponible sous deux jours. Cette solution permet de répondre au besoin du client dans le délai prévu.","Migration vers la nouvelle gamme. Elle constituerait une solution de modernisation durable, mais l’adaptation et la validation du programme nécessiteraient davantage de temps."],
k:"Le maintien du taux de service dépend non seulement des solutions techniques disponibles, mais aussi de leur capacité à respecter les délais convenus avec le client.",
s:"Source : Schneider Electric (2022), Modicon Life Cycle Management Policy, section « Service Phase »."}
];
const CONC="L’obsolescence ne peut pas toujours être évitée, mais ses conséquences peuvent être anticipées.";
const CHAIN="Approvisionnement → Conception → Fin de commercialisation → Migration → Service après-vente";
const END="La gestion de l’obsolescence concerne l’ensemble du cycle de vie de l’automate, et pas uniquement sa fin de vie.";
const LET=["A","B","C"];
const $=id=>document.getElementById(id),app=$("app"),arr=o=>o?Object.values(o):[];
let db,code,uid,S={};
try{uid=localStorage.getItem("uid")||Math.random().toString(36).slice(2,10);localStorage.setItem("uid",uid)}catch(e){uid=Math.random().toString(36).slice(2,10)}
const ans=p=>{const a=p&&p.a||{};return E.map((_,i)=>a[i])};
const score=p=>ans(p).reduce((t,k,i)=>t+(k===E[i].g?1:0),0);
const rail=n=>'<ol class="rail">'+E.map((x,i)=>`<li class="${i<n?"done":i===n?"now":""}">${x.e}</li>`).join("")+"</ol>";
function head(n){const e=E[n];return `<div class="lead">Décision ${n+1} sur ${E.length}</div><p><b>Votre rôle : ${e.r}.</b></p><h2>${e.t}</h2><p>${e.c}</p>${e.i.length?"<ul>"+e.i.map(x=>`<li>${x}</li>`).join("")+"</ul>":""}<p><b>${e.q}</b></p>`}
const nf=c=>`<div class="panel"><h2>Partie introuvable</h2><p class="lead">Aucune partie n’existe avec le code ${c}. Vérifiez le code affiché par l’animateur (si l’animateur recharge sa page, un nouveau code est créé).</p><button class="go" onclick="location.href=location.pathname">Retour</button></div>`;
const er=(m,e)=>{app.innerHTML=`<div class="panel"><h2>Problème de connexion</h2><p class="lead">${m}</p><p class="take">${e&&(e.code||e.message)||""}</p></div>`};
function connect(){db=getDatabase(initializeApp(firebaseConfig))}
const P=p=>ref(db,"sessions/"+code+(p?"/"+p:""));
const listen=fn=>onValue(P(),sn=>{S=sn.val();if(S)fn()});

function landing(){
 const j=new URLSearchParams(location.search).get("join")||"";
 app.innerHTML=`<div class="panel"><h1>Mission : sauvez le service client !</h1><p class="lead">Vous faites partie de NovaControl, entreprise fictive qui fabrique des automates programmables industriels. À chaque étape, le groupe prend une décision pour l’entreprise.</p>
 <h2>Participer</h2><input id="cd" placeholder="Code de la partie" maxlength="4" value="${j.toUpperCase()}" aria-label="Code"><input id="nm" placeholder="Votre prénom" maxlength="20" aria-label="Prénom"><button class="go" id="jn">Rejoindre</button>
 <h2 style="margin-top:22px">Animer</h2><button class="go" id="hs">Créer une partie</button></div>`;
 $("jn").onclick=()=>{const c=$("cd").value.trim().toUpperCase(),n=$("nm").value.trim();if(c.length!==4||!n)return;join(c,n)};
 $("hs").onclick=host}

/* ---------- animateur ---------- */
function host(){connect();const L="ABCDEFGHJKMNPQRSTUVWXYZ23456789";code=Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join("");
 set(P(),{phase:"lobby",n:0,t:Date.now()}).then(()=>listen(renderHost)).catch(e=>er("Impossible de créer la partie. Vérifiez que les règles de la base sont publiées.",e))}
function renderHost(){const s=S,n=s.n||0,e=E[n],pl=s.players||{},np=Object.keys(pl).length;let h="";
 if(s.phase==="lobby"){const u=location.origin+location.pathname+"?join="+code;
  app.innerHTML=`<div class="panel"><h1>Mission : sauvez le service client !</h1><p>Vous faites partie de <b>NovaControl</b>, une entreprise qui conçoit, fabrique et commercialise des automates programmables industriels (API).</p><p><b>Votre objectif :</b> anticiper l’obsolescence des produits tout au long de leur cycle de vie, sans compromettre les engagements de service envers les clients.</p>
  <p class="lead">Les situations sont fictives ; les stratégies reposent sur des pratiques documentées par des études scientifiques et des documents techniques de Schneider Electric. Aucune décision interne de Schneider n’est attribuée.</p>
  <div class="row"><div><div>Code de la partie :</div><div class="code">${code}</div></div><div id="qr"></div></div>
  <div class="pl">${arr(pl).map(p=>`<span>${p.name}</span>`).join("")}</div><button class="go" id="go">Lancer la mission (${np} joueur${np>1?"s":""})</button></div>`;
  new QRCode($("qr"),{text:u,width:170,height:170});$("go").onclick=()=>update(P(),{phase:"vote",votes:null});return}
 if(s.phase==="vote"){const v=arr(s.votes);
  app.innerHTML=`${rail(n)}<div class="panel">${head(n)}<div class="opts">${e.o.map((o,k)=>`<div class="opt"><b>${LET[k]}</b><span>${o}</span></div>`).join("")}</div><p><b>${v.length}</b> vote${v.length>1?"s":""} sur ${np} joueur${np>1?"s":""} · code ${code}</p><button class="go" id="cl">Clore le vote</button></div>`;$("cl").onclick=close;return}
 if(s.phase==="result"){const t=s.tally||[0,0,0],tt=t.reduce((a,b)=>a+b,0)||1;
  app.innerHTML=`${rail(n)}<div class="panel"><h2>${e.t}</h2><div class="opts">${e.o.map((o,k)=>`<div class="opt ${k===e.g?"good":""} ${s.win===k?"sel":""}"><b>${LET[k]}</b><span>${o}${k===e.g?' <b class="up">· Bonne réponse</b>':""}${s.win===k?" <b>· Choix du groupe</b>":""}<small>${Math.round(t[k]/tt*100)} % des votes (${t[k]}). ${e.w[k]}</small><div class="pct"><i style="width:${Math.round(t[k]/tt*100)}%"></i></div></span></div>`).join("")}</div>
  <p class="take"><b>À retenir :</b> ${e.k}</p><p class="lead"><i>${e.s}</i></p><button class="go" id="nx">${n<E.length-1?"Décision suivante":"Voir le bilan"}</button></div>`;
  $("nx").onclick=()=>n<E.length-1?update(P(),{n:n+1,phase:"vote",votes:null,win:null}):update(P(),{phase:"end"});return}
 const g=arr(s.res).reduce((a,b)=>a+b,0),lb=arr(pl).map(p=>({n:p.name,s:score(p)})).sort((a,b)=>b.s-a.s);
 app.innerHTML=`<div class="panel"><h2>Bilan de la mission</h2><p class="chain">${g} décision${g>1?"s":""} juste${g>1?"s":""} sur ${E.length} pour NovaControl</p><p><b>${CONC}</b></p><p class="chain">${CHAIN}</p><p>${END}</p></div><div class="panel"><h2>Classement (sur ${E.length})</h2><ul class="lb">${lb.map(x=>`<li><span>${x.n}</span><b>${x.s}</b></li>`).join("")}</ul></div>`}
function close(){const v=arr(S.votes),t=[0,1,2].map(k=>v.filter(x=>x===k).length),m=Math.max(...t),w=v.length?t.indexOf(m):-1;
 update(P(),{phase:"result",tally:t,win:w,["res/"+S.n]:w===E[S.n].g?1:0})}

/* ---------- participant ---------- */
async function join(c,name){code=c;connect();
 try{const sn=await get(ref(db,"sessions/"+c+"/phase"));if(!sn.exists()){app.innerHTML=nf(c);return}
  await set(ref(db,"sessions/"+c+"/players/"+uid+"/name"),name);listen(renderPlayer)}
 catch(e){er("Impossible de rejoindre la partie. Vérifiez la connexion et les règles de la base.",e)}}
function renderPlayer(){const s=S;if(!s.phase){app.innerHTML=nf(code);return}
 const n=s.n||0,e=E[n],me=(s.players||{})[uid]||{},mine=(s.votes||{})[uid];let h="";
 if(s.phase==="lobby")h=`<div class="panel"><h2>Vous êtes dans la partie</h2><p class="lead">Attendez que l’animateur lance la mission.</p></div>`;
 else if(s.phase==="vote"){app.innerHTML=`${rail(n)}<div class="panel">${head(n)}<div class="opts">${e.o.map((o,k)=>`<button class="opt ${mine===k?"sel":""}" data-k="${k}"><b>${LET[k]}</b><span>${o}</span></button>`).join("")}</div><p class="lead">${mine==null?"Touchez votre choix.":"Vote enregistré, vous pouvez le changer jusqu’à la clôture."}</p></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;set(ref(db,"sessions/"+code+"/votes/"+uid),k);set(ref(db,"sessions/"+code+"/players/"+uid+"/a/"+n),k)});return}
 else if(s.phase==="result"){const a=(me.a||{})[n],ok=a===e.g;
  h=`${rail(n)}<div class="panel"><h2>${e.t}</h2><p>Bonne réponse : <b class="up">${LET[e.g]}</b>. ${e.o[e.g]}</p><p>Le groupe a choisi : <b>${s.win>=0?LET[s.win]:"—"}</b></p>${a!=null?`<p class="take">Votre choix : <b>${LET[a]}</b> · <b class="${ok?"up":"dn"}">${ok?"Correct":"Incorrect"}</b><br>${e.w[a]}</p>`:'<p class="take">Vous n’avez pas voté.</p>'}<p><b>À retenir :</b> ${e.k}</p><p class="lead"><i>${e.s}</i></p></div>`}
 else{const a=ans(me),sc=score(me);
  h=`<div class="panel"><h2>Votre fiche : ${sc} / ${E.length}</h2><ul class="lb">${E.map((x,i)=>`<li><span>${x.e}</span><b class="${a[i]===x.g?"up":"dn"}">${a[i]==null?"—":a[i]===x.g?"Correct":"Incorrect"}</b></li>`).join("")}</ul><p><b>${CONC}</b></p><p class="chain">${CHAIN}</p><p>${END}</p><p class="lead">Faites une capture d’écran pour conserver votre fiche.</p></div>`}
 app.innerHTML=h}

landing();
</script>
</body>
</html>
